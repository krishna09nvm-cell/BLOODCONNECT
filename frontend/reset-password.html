<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Choose a New Password | Blood Donation and Blood Camp Tracker</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page" data-no-account-link>

    <header class="navbar">
        <nav class="container nav-inner">
            <a href="welcome.html" class="logo"><span class="logo-drop"><span>+</span></span>Life<b>Drop</b></a>
            <button class="nav-toggle" aria-label="Open menu"><span></span><span></span><span></span></button>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="statistics.html">Dashboard</a></li>
                <li><a href="login.html">Login</a></li>
            </ul>
        </nav>
    </header>

    <main class="auth-shell narrow">
        <aside class="auth-side" data-floaters="6">
            <div class="auth-art" data-art="auth"></div>
            <h2>Choose a new password</h2>
            <p>Use at least 8 characters with letters and numbers.</p>
            <ul><li>All devices will be logged out</li><li>Then log in with the new password</li></ul>
        </aside>

        <section class="auth-main">
            <h1>New password</h1>
            <p class="sub" id="resetSub">Checking your link…</p>

            <div class="form-alert" id="resetAlert" role="alert" hidden></div>

            <form class="auth-form" id="resetForm" novalidate hidden>
                <div class="form-group">
                    <label for="rpPassword">New password <span class="req">*</span></label>
                    <div class="password-wrap">
                        <input type="password" id="rpPassword" autocomplete="new-password" placeholder="At least 8 characters">
                        <button type="button" class="pw-toggle" data-toggle-password="rpPassword" aria-label="Show password" aria-pressed="false">Show</button>
                    </div>
                    <div class="strength"><div class="strength-bar" id="rpStrength"></div><span id="rpStrengthText"></span></div>
                </div>
                <div class="form-group">
                    <label for="rpConfirm">Confirm new password <span class="req">*</span></label>
                    <div class="password-wrap">
                        <input type="password" id="rpConfirm" autocomplete="new-password" placeholder="Type it again">
                        <button type="button" class="pw-toggle" data-toggle-password="rpConfirm" aria-label="Show password" aria-pressed="false">Show</button>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary btn-block" id="rpBtn">Save new password</button>
            </form>

            <p class="auth-switch"><a href="forgot-password.html">Ask for a new link</a> · <a href="login.html">Login</a></p>
        </section>
    </main>

    <script src="js/common.js"></script>
    <script src="js/decor.js"></script>
    <script src="js/chatbot.js"></script>
    <script src="js/auth.js"></script>
    <script>
        const token = new URLSearchParams(location.search).get("token") || "";
        const alertBox = document.getElementById("resetAlert");
        const form = document.getElementById("resetForm");
        const pw = document.getElementById("rpPassword"), confirmPw = document.getElementById("rpConfirm");
        setupPasswordToggles();
        setupStrengthMeter(pw, document.getElementById("rpStrength"), document.getElementById("rpStrengthText"));

        // Is the link valid?
        authRequest("/auth/reset/check?" + new URLSearchParams({ token }))
            .then(() => { form.hidden = false; document.getElementById("resetSub").textContent = "Enter your new password twice."; })
            .catch(error => { document.getElementById("resetSub").textContent = ""; showFormAlert(alertBox, escapeHtml(error.message)); });

        form.addEventListener("submit", async event => {
            event.preventDefault();
            clearFieldErrors(form);
            showFormAlert(alertBox, "");
            const m1 = pw.value ? RULES.password(pw.value) : "Please enter a new password.";
            const m2 = !confirmPw.value ? "Please type the password again." : confirmPw.value !== pw.value ? "The two passwords do not match." : "";
            setFieldError(pw, m1); setFieldError(confirmPw, m2);
            if (m1 || m2) return;

            const button = document.getElementById("rpBtn");
            button.disabled = true;
            try {
                await authRequest("/auth/reset", { method: "POST", body: { token, password: pw.value, confirmPassword: confirmPw.value } });
                location.href = "login.html?reset=1";
            } catch (error) {
                showFormAlert(alertBox, escapeHtml(error.message));
                button.disabled = false;
            }
        });
    </script>
</body>
</html>
